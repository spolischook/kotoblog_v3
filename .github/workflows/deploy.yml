name: Deploy to S3

on:
  push:
    branches:
      - main  # Trigger the workflow on push or pull request to the main branch

permissions:
  id-token: write   # GitHub OIDC → IAM role, no stored keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: 18

    - name: Install dependencies
      run: npm ci

    - name: Build Tailwind CSS
      run: npm run build

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.118.2'  # Use the version of Hugo you are using

    - name: Build Hugo
      run: hugo --minify --baseURL="https://blog.polishchuk.dev"

    - name: AWS credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        aws-region: eu-central-1

    - name: Deploy to S3
      run: aws s3 sync public/ "s3://${{ secrets.S3_BUCKET }}/" --delete --follow-symlinks

    - name: Invalidate CloudFront distribution
      run: aws cloudfront create-invalidation --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
