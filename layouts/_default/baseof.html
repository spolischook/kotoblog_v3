    <script>
        (function () {
            var t;
            try { t = localStorage.getItem('theme'); } catch (e) {}
            var dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.classList.toggle('dark', dark);
            document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        })();
    </script>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/syntax.css">
    <script src="/js/script.js" defer></script>

<body class="bg-slate-100 text-zinc-800 bg-[url('/images/background.png')] dark:bg-none dark:bg-zinc-950 dark:text-zinc-300">
<div class="container bg-white dark:bg-zinc-900 min-h-screen">
    {{ $t := "Jan 02, 2006 3:04 PM Z07:00" }}

    <header class="flex justify-between bg-zinc-700 dark:bg-zinc-800 text-white px-4 font-sans py-2 sm:py-0 relative">
        <a href="/" class="flex items-center justify-center space-x-2 hover:no-underline text-white hover:text-white">
            <picture>
                <source type="image/avif" srcset="/images/header-ava.avif">
                <source type="image/webp" srcset="/images/header-ava.webp">
                <img class="rounded-full" alt="Serhii Polishchuk profile picture" src="/images/header-ava.jpg" width="32px" height="32px">
            </picture>
            <span class="text-xl">Serhii Polishchuk</span>
        </a>
        <div class="flex items-center space-x-2">
            {{ partial "menu.html" (dict "menuID" "main" "page" .) }}
            <button id="theme-toggle" type="button" class="p-2 text-zinc-300 hover:text-white focus:outline-none" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg class="w-5 h-5 dark:hidden" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
                <svg class="w-5 h-5 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"/>
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
            </button>
        </div>
    </header>

    <main class="px-4 py-5">

</div>
<footer class="py-3 bg-stone-100 dark:bg-zinc-800 font-sans">
